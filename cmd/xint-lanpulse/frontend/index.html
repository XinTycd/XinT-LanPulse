<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XinT-LanPulse</title>
<style>body{font:16px system-ui,sans-serif;max-width:600px;margin:2rem auto;padding:0 1rem;color:#233}input,button{font:inherit;padding:.5rem}input{max-width:15rem}button{cursor:pointer}li{margin:.5rem 0}#result,#notice{min-height:1.5em}label{display:inline-block;margin:.4rem 0}</style></head>
<body><h1>XinT-LanPulse</h1><p>输入设备 IPv4 地址，检测是否可达。</p>
<form id="form"><label>地址 <input id="address" placeholder="192.168.20.1" required></label> <button id="check">检测</button>
<p><label>超时（毫秒） <input id="timeout" type="number" min="100" max="60000" value="1000" required></label></p>
<p><label>尝试次数 <input id="attempts" type="number" min="1" max="10" value="1" required></label></p></form>
<p><label>并发数 <input id="workers" type="number" min="1" max="16" value="4" required></label></p><p id="result" role="status"></p><h2>设备清单</h2><p>将当前地址添加到本机清单，可选择或删除。</p>
<button id="add" type="button">添加当前地址</button> <button id="batch" type="button">并发检测设备</button><button id="export" type="button">导出清单</button> <label>导入清单 <input id="import" type="file" accept="application/json,.json"></label><p><label>定时间隔（分钟） <input id="interval" type="number" min="1" max="1440" value="15"></label> <button id="schedule" type="button">开启定时检测</button></p><p id="schedule-status" role="status">定时检测未开启。</p><p id="batch-status" role="status"></p><p id="notice" role="status"></p><ul id="devices"></ul>
<h2>本次检测记录</h2><button id="clear" type="button">清空记录</button><ul id="history"></ul><script src="/main.js"></script></body></html>
